[project]
name = "climatebridge"
version = "0.1.0"
description = "Lokale HTTP-Bridge zwischen MELCloud (python-melcloud) und der ClimateControl-Menubar-App"
requires-python = ">=3.12"
dependencies = [
    "python-melcloud>=0.1.3",   # Import-Name: pymelcloud
    "aiohttp>=3.9",
    "keyring>=25",              # Passwort im macOS-Schlüsselbund
    "truststore>=0.10",         # TLS-Prüfung über den macOS-Schlüsselbund (python.org-Python hat keine CA-Zertifikate)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
climatebridge = "climatebridge.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
